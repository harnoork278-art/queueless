{% extends 'base.html' %}

{% block title %}Register – QueueLess Virtual Queue{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Student Registration</h2>
            <p>Create an account to generate virtual queue tokens</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name *</label>
                <input 
                    type="text" 
                    id="full_name" 
                    name="full_name" 
                    class="form-control" 
                    placeholder="e.g. Rahul Sharma" 
                    value="{{ full_name|default('') }}" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username *</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="e.g. rahul2026" 
                    value="{{ username|default('') }}" 
                    required
                >
                <div class="form-text">Used for sign in. Minimum 3 characters.</div>
            </div>

            <div class="grid-2" style="gap: 0.75rem;">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="student@college.edu" 
                        value="{{ email|default('') }}"
                    >
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        class="form-control" 
                        placeholder="9876543210" 
                        value="{{ phone|default('') }}"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Create a password" 
                    required
                >
                <div class="form-text">Minimum 4 characters.</div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-control" 
                    placeholder="Re-enter password" 
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
                Register & Get Started
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
