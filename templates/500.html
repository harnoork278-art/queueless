{% extends 'base.html' %}

{% block title %}500 - Internal Server Error | QueueLess{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
    <h1 style="font-size: 4rem; color: #fca5a5; margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Something went wrong while processing your request. Please try again shortly.</p>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
