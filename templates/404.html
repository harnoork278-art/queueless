{% extends 'base.html' %}

{% block title %}404 - Page Not Found | QueueLess{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
    <h1 style="font-size: 4rem; color: #cbd5e1; margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">The page or token ticket you are looking for does not exist or has been removed.</p>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
